arazzo: 1.1.0
$self: https://api.example.com/workflows/async-order.arazzo.yaml
info:
  title: Asynchronous pet order
  summary: Exercises every Arazzo 1.1 feature
  description: Search for a pet over HTTP, place the order over Kafka, then wait for the confirmation.
  version: 2.0.0
  x-owner: pets-team
sourceDescriptions:
  - name: petStore
    url: ./petstore.openapi.yaml
    type: openapi
  - name: orders
    url: ./orders.asyncapi.yaml
    type: asyncapi
  - name: shared
    url: https://api.example.com/workflows/shared.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: placeAsyncOrder
    summary: Find, order and confirm a pet
    dependsOn:
      - $sourceDescriptions.shared.authenticate
    inputs:
      $ref: '#/components/inputs/orderInputs'
    parameters:
      - reference: $components.parameters.storeId
    failureActions:
      - reference: $components.failureActions.retryLater
    steps:
      - stepId: findPets
        description: Search available pets using a raw query string.
        operationId: $sourceDescriptions.petStore.findPetsByStatus
        parameters:
          - name: fullQuery
            in: querystring
            value: "status=available&category={$inputs.category}"
          - name: X-Correlation-Id
            in: header
            value: $inputs.correlationId
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            condition: $[?count(@.pets) > 0]
            type:
              type: jsonpath
              version: rfc9535
          - context: $response.header.Content-Type
            condition: '^application/json'
            type: regex
        outputs:
          petId:
            context: $response.body
            selector: $.pets[0].id
            type: jsonpath
          firstPetName:
            context: $response.body
            selector: /pets/0/name
            type: jsonpointer
          allPets: $response.body#/pets
        onSuccess:
          - name: noPets
            type: end
            criteria:
              - condition: $response.body#/pets/0 == null
      - stepId: placeOrder
        description: Publish the order on the place-order channel.
        channelPath: '{$sourceDescriptions.orders.url}#/channels/place-order'
        action: send
        parameters:
          - name: orderRequestId
            in: header
            value: $inputs.correlationId
        requestBody:
          contentType: application/json
          payload:
            petId: 0
            quantity: 1
            note: "Ordered by {$inputs.customerName}"
          replacements:
            - target: /petId
              value: $steps.findPets.outputs.petId
            - target: $.quantity
              targetSelectorType:
                type: jsonpath
                version: draft-goessner-dispatch-jsonpath-00
              value: $inputs.quantity
      - stepId: confirmOrder
        description: Wait for the confirmation message.
        operationId: $sourceDescriptions.orders.confirmOrder
        action: receive
        correlationId: $inputs.correlationId
        timeout: 6000
        dependsOn:
          - placeOrder
        successCriteria:
          - condition: $message.payload#/status == 'confirmed'
        onFailure:
          - name: giveUp
            type: end
            criteria:
              - condition: $message.payload#/status == 'rejected'
        outputs:
          orderId: $message.payload#/orderId
    outputs:
      orderId: $steps.confirmOrder.outputs.orderId
      petName: $steps.findPets.outputs.firstPetName
  - workflowId: cancelOrder
    summary: Cancel an order placed by placeAsyncOrder
    dependsOn:
      - placeAsyncOrder
    inputs:
      type: object
      properties:
        orderId:
          type: string
    steps:
      - stepId: cancel
        operationPath: '{$sourceDescriptions.petStore.url}#/paths/~1store~1order~1{orderId}/delete'
        dependsOn:
          - $workflows.placeAsyncOrder.steps.confirmOrder
        parameters:
          - name: orderId
            in: path
            value: $workflows.placeAsyncOrder.outputs.orderId
        successCriteria:
          - context: $statusCode
            condition: '^2\d{2}$'
            type: regex
components:
  inputs:
    orderInputs:
      type: object
      required: [correlationId, quantity]
      properties:
        category:
          type: string
        quantity:
          type: integer
          format: int32
        correlationId:
          type: string
        customerName:
          type: string
        x-store-id:
          type: string
  parameters:
    storeId:
      name: X-Store-Id
      in: header
      value: $inputs.x-store-id
  failureActions:
    retryLater:
      name: retryLater
      type: retry
      retryAfter: 1.5
      retryLimit: 3
      criteria:
        - condition: $statusCode == 503
x-generated-by: swift-arazzo tests
